# The repo ships CLAUDE.md and no AGENTS.md. Its bytes become AGENTS.md, CLAUDE.md
# becomes a link to it, and the closing line names the file that holds the block
# (§FS-002-init.3, §FS-002-init.5).
args = ["init"]
exit = 0
git = true
stderr_contains = [
  "linked ./CLAUDE.md",
  "see AGENTS.md for what agents are told; the findings carry the rest.",
]
creates = [".agents/fissile.toml", "AGENTS.md", "CLAUDE.md"]
[[files]]
path = "AGENTS.md"
# The adopted content travels, and the block joins it rather than replacing it.
contains = [
  "House rules an agent must read.",
  "## Keeping Files Small With fissile (v3)",
]
