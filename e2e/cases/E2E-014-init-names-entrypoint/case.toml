# The repo ships CLAUDE.md and no AGENTS.md, so the block lands in CLAUDE.md and
# the closing line must name it (§FS-002-init.5).
args = ["init"]
exit = 0
git = true
stderr_contains = [
  "CLAUDE.md",
  "see CLAUDE.md for what agents are told; the findings carry the rest.",
]
creates = [".agents/fissile.toml", "CLAUDE.md"]
