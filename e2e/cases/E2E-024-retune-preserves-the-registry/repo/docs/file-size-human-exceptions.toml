fissile_exceptions_version = 2

# A comment the rewrite must preserve.
[[exceptions]]
path = "src/small.rs"
match = "exact"
rules = ["rust"]
kind = "deferred"
max_accepted = { value = 8, unit = "lines" }
until = "the case-builder module lands"
reason = '''
Prose, not structure. It quotes a registry on purpose:
[[exceptions]]
max_accepted = { value = 1, unit = "lines" }
'''

[[exceptions]]
path = "src/big.rs"
match = "exact"
rules = ["rust"]
kind = "deferred"
max_accepted = { value = 8, unit = "lines" }
until = "the case-builder module lands"
reason = "The entry the address names."
