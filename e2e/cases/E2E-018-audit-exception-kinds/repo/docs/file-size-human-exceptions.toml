fissile_exceptions_version = 2

[[exceptions]]
path = "src/big.rs"
match = "exact"
rules = ["rust"]
kind = "structural"
max_accepted = { value = 5, unit = "lines" }
until = "indefinite"
reason = """
A generated table the snapshot test asserts byte-identical; splitting it would
break the byte comparison the test exists to make.
"""

# No `kind`: the entry counts as deferred, and the kind/until agreement is not
# applied to it (§FS-003-exceptions.2.1).
[[exceptions]]
path = "src/retired.rs"
match = "exact"
rules = ["rust"]
max_accepted = { value = 5, unit = "lines" }
until = "the reader module lands"
reason = """
No module owns the staged-blob reader yet.
"""
