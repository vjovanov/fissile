fissile_config_version = 1

[scan]
include = [
  "src",
  "benches",
  "docs",
  "tests/e2e",
  "examples",
  "scripts",
  ".github",
  "README.md",
  "CLAUDE.md",
  "Cargo.toml",
]
exclude = [
  "target/**",
  ".git/**",
  "**/*.lock",
  "**/*.profraw",
  "**/*.profdata",
  "**/*.png",
  "**/*.jpg",
  "**/*.jpeg",
  "**/*.gif",
  "**/*.webp",
  "**/*.pdf",
]
respect_gitignore = true

[output]
format = "text"
color = "auto"
success = "ok"

[exceptions]
soft_registry = "docs/file-size-agent-exceptions.toml"
hard_registry = "docs/file-size-human-exceptions.toml"
stale = "warn"

[exceptions.bump]
lines = 100
bytes = 4096
tokens = 1000

[tokens]
enabled = false
command = ["token-counter", "--count", "{path}"]

[[messages]]
id = "split-rust-library-soft"
text = """
Should split, next time you are in one of these modules: move one cohesive behavior into a sibling module, keeping the seams the crate already has — measurement, evaluation, exceptions, rendering, CLI surface. Split along that grain, not at the line count.
If no split leaves the crate clearer, record why instead of forcing one: name the constraint that makes splitting illegal (--kind structural), or the seam that does not exist yet and what has to exist first (--kind deferred, --until naming what retires it):
fissile exception add <path> --severity soft --rule {rule} --kind <kind>
"""

[[messages]]
id = "split-rust-library-hard"
text = """
Must split before more surface area lands here: move cohesive behavior into sibling modules along the crate's existing seams. Do not add a layer of indirection or move code somewhere it does not belong to get under the limit.
If you cannot see a split that keeps the module boundaries honest, stop and ask a human. A human-reviewed exception is the only other way through, and its reason names the constraint that makes splitting illegal (--kind structural) or the seam that is missing and what must exist first (--kind deferred):
fissile exception add <path> --severity hard --rule {rule} --kind <kind>
"""

[[messages]]
id = "split-rust-benchmark"
text = """
Keep benchmark setup and measured cases compact so a performance change stays reviewable: move fixtures and helpers out of the measured path rather than growing the case list (§AR-002-instruction-benchmarks).
"""

[[messages]]
id = "split-spec-soft"
text = """
Should split, next time you edit one of these declarations: keep the declaration focused and move secondary detail into a narrower spec the parent cites. Split at a real section boundary — a citation that stops resolving costs more than the extra lines.
If the declaration has to be read whole, record it instead — naming what makes it indivisible (--kind structural), or the child declaration that does not exist yet (--kind deferred, --until naming what retires it):
fissile exception add <path> --severity soft --rule {rule} --kind <kind>
"""

[[messages]]
id = "split-spec-hard"
text = """
Must split before adding more: move secondary detail into a child declaration this one cites, and keep every citation into it resolvable. If no split leaves the spec coherent, ask a human rather than cutting at an arbitrary heading.
"""

[[messages]]
id = "trim-entrypoint"
text = """
Every agent session reads this file whole before it does anything, so each line is paid on every one of those reads. Move depth into a spec under docs/ and cite it from here: a citation costs the reader nothing until they follow it, and what it points at is then fetched one section at a time.
"""

[[messages]]
id = "trim-readme"
text = """
The README is the front door, not a manual: move depth into docs/ and cite it rather than growing the overview. If a section has to stay inline for a first-time reader, say so in an exception instead of trimming what they need.
"""

[[messages]]
id = "split-tooling"
text = """
Keep workflow and helper scripts short enough to audit quickly: extract steps into scripts/ that the workflow calls, rather than growing an inline block (§AR-001-ci).
"""

[[messages]]
id = "large-file-default"
text = """
Large file for its type. Exclude it in [scan].exclude if it is generated or binary; otherwise give it a rule of its own with a limit and guidance that fit it (§FS-001-config.3.3).
"""

[[rules]]
id = "large-file-default"
include = ["**/*"]
unit = "bytes"
soft = 65536
hard = 131072
message = "large-file-default"

[[rules]]
id = "rust-library"
include = ["src/**/*.rs"]
unit = "lines"
soft = 700
hard = 900
count_blank_lines = false
count_comment_lines = true
soft_message = "split-rust-library-soft"
hard_message = "split-rust-library-hard"

[[rules]]
id = "rust-benchmarks"
include = ["benches/**/*.rs"]
unit = "lines"
soft = 250
hard = 400
count_blank_lines = false
count_comment_lines = true
message = "split-rust-benchmark"

# Budget follows how a document is read (§FS-001-config.0.1). This repository is
# grounded, so a declaration is fetched by section — `grund FS-001-config.3`
# returns §3 — and its length is never charged to a reader who wanted one part of
# it, the way a source file's is. 750 is roughly 3x the p95 (222-225 non-blank
# lines) of the fissile, grund and ephor spec trees, and marks where a document
# has started covering two subjects; 2000 is the ceiling rhei's architecture spec
# sets for any file, and 1500 would leave its largest spec 18 lines of headroom.
[[rules]]
id = "spec-docs"
include = ["docs/**/*.md", "examples/**/*.md", "tests/e2e/**/*.md"]
unit = "lines"
soft = 750
hard = 2000
count_blank_lines = false
count_comment_lines = true
soft_message = "split-spec-soft"
hard_message = "split-spec-hard"

# The other reading mode: AGENTS.md — and CLAUDE.md, a symlink to it
# (§DF-009-one-file-agents-read) — is read whole into every agent session, so
# every line is charged on every one of those reads and the tight budget stays.
# README.md is an entrypoint too but keeps its own larger rule below: it is a
# front door for a human arriving cold, not a file loaded into a session.
[[rules]]
id = "entrypoints"
include = ["AGENTS.md", "CLAUDE.md", ".claude/CLAUDE.md", "GEMINI.md"]
unit = "lines"
soft = 250
hard = 500
count_blank_lines = false
count_comment_lines = true
message = "trim-entrypoint"

# The README is the project's front door, not a focused declaration; it gets a
# far larger budget than the spec docs. Up to ~2000 lines is acceptable.
[[rules]]
id = "readme"
include = ["README.md"]
unit = "lines"
soft = 1800
hard = 2000
count_blank_lines = false
count_comment_lines = true
message = "trim-readme"

[[rules]]
id = "tooling"
include = [".github/**/*.yml", ".github/**/*.yaml", "scripts/**/*.sh"]
unit = "lines"
soft = 200
hard = 350
count_blank_lines = false
count_comment_lines = true
message = "split-tooling"

[[rules]]
id = "config-toml"
include = ["**/*.toml"]
unit = "lines"
soft = 180
hard = 300
count_blank_lines = false
count_comment_lines = true
message = "split-tooling"
