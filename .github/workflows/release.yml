name: Release

# The release pipeline (§AR-001-ci.8): verify the version, build PGO binaries
# for six targets, self-check and size-guard each via scripts/release/, publish
# the crate idempotently, and publish a GitHub release whose notes come from
# docs/changelog.md.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v"
        required: true
      publish_crates:
        description: "Publish fissile to crates.io"
        type: boolean
        default: true
      create_github_release:
        description: "Create or update the GitHub release and upload artifacts"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Pin the toolchain so all six PGO binaries share one compiler version.
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  verify:
    name: verify release inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish_crates: ${{ steps.resolve.outputs.publish_crates }}
      create_github_release: ${{ steps.resolve.outputs.create_github_release }}
      create_tag: ${{ steps.resolve.outputs.create_tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release version and mode
        id: resolve
        shell: bash
        run: |
          bash scripts/release/resolve-release.sh \
            "${GITHUB_EVENT_NAME}" "${GITHUB_REF_TYPE}" "${GITHUB_REF_NAME}" \
            "${{ inputs.version }}" "${{ inputs.publish_crates }}" "${{ inputs.create_github_release }}"

      # Fail fast: the publish step lives behind a long PGO matrix, so an
      # unset secret must be discovered before it, not after.
      - name: Preflight crates.io token
        if: steps.resolve.outputs.publish_crates == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "error: publish_crates=true but the CARGO_REGISTRY_TOKEN secret is not set" >&2
            exit 1
          fi

      # A missing or malformed changelog section must fail before the builds,
      # not in the last job (§AR-001-ci.8).
      - name: Extract release notes early
        run: python3 scripts/prepare_changelog_release.py notes "${{ steps.resolve.outputs.version }}" --output /tmp/release-notes.md

  prepare-release-ref:
    name: prepare release tag
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.ref.outputs.release_ref }}
      release_sha: ${{ steps.ref.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create or resolve release tag
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.verify.outputs.tag }}"
          version="${{ needs.verify.outputs.version }}"

          emit_release_ref() {
            local ref="$1"
            bash scripts/release/verify-version.sh "$version" "$ref"
            echo "release_ref=$ref" >> "$GITHUB_OUTPUT"
            echo "release_sha=$(git rev-list -n 1 "$ref")" >> "$GITHUB_OUTPUT"
          }

          # Manual releases create the tag from the selected commit;
          # tag-triggered releases already have the ref; dry runs with
          # publishing disabled do not need a tag (§AR-001-ci.8).
          if [ "${{ needs.verify.outputs.create_tag }}" != "true" ]; then
            emit_release_ref "$GITHUB_SHA"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
            emit_release_ref "$tag"
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/${tag}"
          emit_release_ref "$tag"

  build-linux-gnu-pgo:
    name: PGO binary (${{ matrix.triple }})
    needs:
      - verify
      - prepare-release-ref
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux2014 images pinned by digest (tag 2026.05.13-1) so a
          # registry-side rebuild cannot shift the glibc 2.17 baseline
          # mid-release.
          - triple: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            image: "quay.io/pypa/manylinux2014_x86_64@sha256:8149fab622c82b6f5feb63df797b6d762551c5780d3a6c188893609700775fc7"
          - triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            image: "quay.io/pypa/manylinux2014_aarch64@sha256:abd9b0ca7c11710ac3c5ab22ac699e50a0b579a9cbdfb3e84cb9d2709d33b5da"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release-ref.outputs.release_ref }}

      - name: Build PGO release binary in manylinux2014
        env:
          IMAGE: ${{ matrix.image }}
          RUST_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: |
          docker run --rm \
            -e RUST_TOOLCHAIN \
            -v "$PWD:/work" \
            -w /work \
            "$IMAGE" \
            bash -lc '
              set -euo pipefail
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
              source "$HOME/.cargo/env"
              rustup component add llvm-tools-preview
              bash scripts/pgo-build.sh
            '

      # Files written from inside the container are root-owned on the host.
      - name: Restore ownership of build outputs
        run: sudo chown -R "$(id -u):$(id -g)" target

      - name: Self-check, size-guard, and package
        id: package
        run: bash scripts/release/package.sh "${{ needs.verify.outputs.version }}" "${{ matrix.triple }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package.outputs.archive }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  build-native-pgo:
    name: PGO binary (${{ matrix.os }})
    needs:
      - verify
      - prepare-release-ref
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel    # x86_64-apple-darwin
            pgo_required: true
          - os: macos-15          # aarch64-apple-darwin
            pgo_required: true
          - os: windows-latest    # x86_64-pc-windows-msvc
            pgo_required: true
          - os: windows-11-arm    # aarch64-pc-windows-msvc
            pgo_required: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release-ref.outputs.release_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-release-pgo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-release-pgo-${{ env.RUST_TOOLCHAIN }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Build PGO release binary
        id: pgo
        continue-on-error: ${{ ! matrix.pgo_required }}
        shell: bash
        run: bash scripts/pgo-build.sh

      # Windows ARM hosted runners can fail during LLVM PGO training even
      # though the ordinary release binary is sound; keep the platform artifact
      # self-checked without blocking the release (§AR-001-ci.8).
      - name: Build LTO release binary fallback
        if: ${{ ! matrix.pgo_required && steps.pgo.outcome == 'failure' }}
        shell: bash
        run: cargo build --release --locked

      - name: Self-check, size-guard, and package
        id: package
        shell: bash
        run: bash scripts/release/package.sh "${{ needs.verify.outputs.version }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package.outputs.archive }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  publish-crates:
    name: publish crates.io package
    needs:
      - verify
      - prepare-release-ref
      - build-linux-gnu-pgo
      - build-native-pgo
    if: needs.verify.outputs.publish_crates == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release-ref.outputs.release_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Re-running this job after a partial success must be safe: skip when
      # the exact fissile@<version> already exists rather than letting
      # `cargo publish` fail with "already uploaded".
      - name: Check crates.io publication state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -A 'fissile-release/0.1' \
            "https://crates.io/api/v1/crates/fissile/${version}")"
          case "$code" in
            200) published="true" ;;
            404) published="false" ;;
            *)
              echo "error: unexpected HTTP $code querying crates.io for fissile ${version}" >&2
              exit 1
              ;;
          esac
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "fissile $version already on crates.io: $published"

      - name: Publish fissile
        if: steps.state.outputs.published == 'false'
        run: cargo publish --locked

  github-release:
    name: publish GitHub release
    needs:
      - verify
      - prepare-release-ref
      - build-linux-gnu-pgo
      - build-native-pgo
      - publish-crates
    if: always() && needs.verify.outputs.create_github_release == 'true' && needs.build-linux-gnu-pgo.result == 'success' && needs.build-native-pgo.result == 'success' && (needs.publish-crates.result == 'success' || needs.publish-crates.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release-ref.outputs.release_ref }}

      - name: Download binary artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Extract release notes
        run: python3 scripts/prepare_changelog_release.py notes "${{ needs.verify.outputs.version }}" --output release-notes.md

      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.verify.outputs.tag }}"
          version="${{ needs.verify.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file release-notes.md
            gh release upload "$tag" release-artifacts/* --clobber
          else
            gh release create "$tag" release-artifacts/* \
              --verify-tag \
              --title "fissile ${version}" \
              --notes-file release-notes.md
          fi
