# Example fissile configuration shape.
# Copy to the target repository as `.agents/fissile.toml`.
#
# Every value is spelled out at its default so the file is editable in place
# without consulting the spec; omitting a field is also legal and takes the same
# default (§DF-002-explicit-config).

fissile_config_version = 1

[scan]
# `check --staged` ignores this and receives its file set from git. `audit`
# walks these roots.
include = ["src", "tests", "benches", "docs", "e2e", "README.md", "CLAUDE.md"]
exclude = [
  "target/**",
  "node_modules/**",
  ".git/**",
  "dist/**",
  "build/**",
  "vendor/**",
  "**/*.lock",
  "**/*.min.*",
  "**/*.png",
  "**/*.jpg",
  "**/*.jpeg",
  "**/*.gif",
  "**/*.webp",
  "**/*.pdf",
]
respect_gitignore = true

[output]
format = "text" # text | json
color = "auto" # auto | always | never
success = "ok"

[exceptions]
# Structured oversized-file rationales. Each entry has a typed ceiling so
# findings resume if the accepted file keeps growing.
soft_registry = "docs/file-size-agent-exceptions.toml"
hard_registry = "docs/file-size-human-exceptions.toml"
stale = "warn" # warn | error | ignore

[tokens]
# Token budgets are opt-in; bytes and lines work without external tooling.
enabled = false
command = ["token-counter", "--count", "{path}"]

# A tuned config names destinations the defaults cannot guess, and says
# something different at each severity: soft asks for a split next time the file
# is touched and offers the recorded-debt way out; hard says what has to happen
# before more code lands and who to escalate to. Add a citation into this
# repository's own architecture docs if it keeps them — never an ID borrowed
# from another project, which resolves nowhere for the reader who sees it.

[[messages]]
id = "split-rust-soft"
text = """
Should split, next time you are in one of these modules: move a cohesive group of items into a sibling module under the same parent. Split along a responsibility seam, never at the line count.
If no split leaves the design better, record the debt instead of forcing one — with a written reason and a revisit trigger:
fissile exception add <path> --severity soft --rule {rule}
"""

[[messages]]
id = "split-rust-hard"
text = """
Must split before more code lands here: move cohesive groups of items into sibling modules along existing seams, keeping the public surface in the parent. Do not invent an abstraction or shuffle lines to get under the limit.
If you cannot see a safe split, stop and ask a human. A human-reviewed exception is the only other way through:
fissile exception add <path> --severity hard --rule {rule}
"""

[[messages]]
id = "split-doc-soft"
text = """
Should split, next time you edit one of these documents: keep one focused subject per file and move secondary detail into a child document the parent links.
If the document has to be read whole, record it instead — with a written reason and a revisit trigger:
fissile exception add <path> --severity soft --rule {rule}
"""

[[messages]]
id = "split-doc-hard"
text = """
Must split before adding more: move secondary detail into linked child documents. If no split keeps the document coherent, ask a human rather than cutting at an arbitrary heading.
"""

[[messages]]
id = "large-fixture"
text = """
Large fixture data. Generate it at test time or move it out of the source tree; if the corpus has to stay checked in, accept it with a written exception rather than trimming it arbitrarily.
"""

[[messages]]
id = "large-file-default"
text = """
Large file for its type. Exclude it in [scan].exclude if it is generated, vendored, or binary; otherwise give this file type a rule of its own with a limit and guidance that fit it.
"""

[[rules]]
id = "large-file-default"
include = ["**/*"]
unit = "bytes"
soft = 524288
hard = 1048576
message = "large-file-default"

[[rules]]
id = "rust-source"
include = ["src/**/*.rs", "benches/**/*.rs"]
unit = "lines"
soft = 350
hard = 550
count_blank_lines = false
count_comment_lines = true
soft_message = "split-rust-soft"
hard_message = "split-rust-hard"

[[rules]]
id = "generated-rust"
include = ["src/**/*.gen.rs"]
unit = "lines"
soft = 1200
hard = 2000
count_blank_lines = false
count_comment_lines = true
# Explicit priority resolves overlap with broader Rust source rules. Higher wins.
priority = 20
soft_message = "split-rust-soft"
hard_message = "split-rust-hard"

[[rules]]
id = "rust-tests"
include = ["tests/**/*.rs"]
unit = "lines"
soft = 450
hard = 700
count_blank_lines = false
count_comment_lines = true
soft_message = "split-rust-soft"
hard_message = "split-rust-hard"

[[rules]]
id = "markdown-docs"
include = ["docs/**/*.md", "README.md", "CLAUDE.md"]
unit = "lines"
soft = 250
hard = 500
count_blank_lines = false
count_comment_lines = true
soft_message = "split-doc-soft"
hard_message = "split-doc-hard"

[[rules]]
id = "fixtures"
include = ["tests/fixtures/**", "e2e/cases/**"]
unit = "bytes"
soft = 65536
hard = 262144
message = "large-fixture"
