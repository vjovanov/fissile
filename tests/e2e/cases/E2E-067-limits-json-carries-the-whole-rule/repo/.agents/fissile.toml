fissile_config_version = 1

[scan]
include = ["src"]
exclude = []
respect_gitignore = false

[[messages]]
id = "split"
text = "Split the file."

[[messages]]
id = "shrink"
text = "Shrink the asset."

[[rules]]
id = "rust"
include = ["src/**/*.rs", "tests/**/*.rs"]
unit = "lines"
soft = 2
hard = 8
message = "split"
count_blank_lines = true

[[rules]]
id = "assets"
include = ["assets/**/*.png"]
unit = "bytes"
hard = 4096
message = "shrink"
priority = 3

[[rules]]
id = "notes"
include = ["notes/*.md"]
unit = "lines"
soft = 40
soft_message = "split"
