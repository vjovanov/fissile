args = [
  "exception", "retune", "src/big.rs",
  "--severity", "soft",
  "--rule", "rust",
]
exit = 2
# No --max was passed, so no --max is blamed; the remedy matches the one
# §E2E-023-audit-reports-loose-ceilings prints for the same entry.
stderr_contains = [
  "src/big.rs measures 1 lines, under rule rust soft limit 2",
  "silence nothing — remove the entry rather than retuning it",
  # The remedy names the command that performs it (§FS-009-exception-remove.1),
  # addressed as the caller addressed the entry — so it runs as printed.
  "fissile exception remove src/big.rs --severity soft --rule rust",
]
