fissile_config_version = 1

[scan]
include = ["src"]
exclude = []
respect_gitignore = false

# 55 is a multiple of the step, so the last ceiling a soft entry may hold is 50
# and every file above 50 lines rounds into the refusal.
[exceptions.bump]
lines = 10

[[messages]]
id = "m"
text = "Split the file."

[[rules]]
id = "rust"
include = ["src/**/*.rs"]
unit = "lines"
soft = 35
hard = 55
message = "m"
