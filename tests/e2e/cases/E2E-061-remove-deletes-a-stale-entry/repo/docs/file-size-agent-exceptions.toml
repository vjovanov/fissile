fissile_exceptions_version = 2

[[exceptions]]
path = "src/moved.rs"
match = "exact"
rules = ["rust"]
kind = "deferred"
max_accepted = { value = 20, unit = "lines" }
until = "the case-builder module lands"
reason = """
Missing boundary: the module this belongs in does not exist yet.
"""

[[exceptions]]
path = "src/big.rs"
match = "exact"
rules = ["rust"]
kind = "deferred"
max_accepted = { value = 20, unit = "lines" }
until = "the case-builder module lands"
reason = """
Missing boundary: the module this belongs in does not exist yet.
"""
