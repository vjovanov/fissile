# Strict loading rejects this post-hard-removal state in E2E-054. The selected
# soft removal is the narrow repair path required by §FS-009-exception-remove.2.
args = [
  "exception", "remove", "src/big.rs",
  "--severity", "soft",
  "--rule", "rust",
]
exit = 0
stdout_contains = [
  "docs/file-size-agent-exceptions.toml: removed src/big.rs (accepted up to 100 lines)",
]

[[files]]
path = "docs/file-size-agent-exceptions.toml"
contains = ['''fissile_exceptions_version = 2

# This standalone registry note is unrelated to either entry.

# This entry and its formatting must survive byte for byte.
[[exceptions]]
path = "src/other.rs"
match = "exact"
rules = ["rust"]
kind = "deferred"
max_accepted = { value = 8, unit = "lines" }
until = "src/other.rs is split"
reason = """
Keep the unrelated rationale exactly as written.
"""
''']
excludes = [
  'path = "src/big.rs"',
  'shadows = "hard"',
  'max_accepted = { value = 100, unit = "lines" }',
]
