fissile_config_version = 1

[scan]
include = ["src"]
exclude = []
respect_gitignore = false

# The run is JSON because the config says so, not because a flag did.
[output]
format = "json"

[[messages]]
id = "m"
text = "Split the file."

[[rules]]
id = "rust"
include = ["src/**/*.rs"]
unit = "lines"
soft = 2
hard = 8
message = "m"
