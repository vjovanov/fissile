args = ["check", "--no-color"]
exit = 1
stdout_equals = """
hard: 1 file over the 6-line budget [rule: rust, message: must-split]
  Must split before more code lands here. If you cannot see a split that leaves
  the architecture intact, stop and ask a human.
    src/big.rs: 8 non-blank lines (budget 6; an exception here would accept 100)

soft: 2 files over the 2-line budget [rule: rust, message: should-split]
  Should split, next time you are in one of these files: move a cohesive group
  of items into a sibling module along a seam that already exists.
  If no split leaves the design better, record it instead of forcing one:
  fissile exception add <path> --severity soft --rule rust
    src/a.rs: 4 non-blank lines (budget 2)
    src/b.rs: 3 non-blank lines (budget 2)

hint: fissile measure <path>... reports size and headroom for the files you split into."""
